 sub:'Four econometric tests, and one reading I had to retract',
 thesis:'Paraná harvested 775,959 tonnes of yerba mate in 2024, more than double the next state, and 85.8% of everything Brazil still picks in native forest. Read from the endpoints, the series looks like a clean transition from forest to field. Read year by year, it says the opposite: the forest led in 18 of the 20 years to 2023, and 2024 is the first cultivated lead since 2006.',

 k1:'THE QUESTION', h1s:'What does a 775,959-tonne number actually say?',
 p1a:'Yerba mate is one of the few crops in Brazil that is still harvested in two ways at once: pruned from planted stands, which IBGE’s Municipal Agricultural Production survey (PAM) records, and picked from trees standing in native araucaria forest, which the Vegetal Extraction and Silviculture survey (PEVS) records separately. Adding the two gives Paraná 775,959 tonnes in 2024, against 302,212 for Rio Grande do Sul and 139,764 for Santa Catarina.',
 p1b:'This study asks four questions of that number. Does supply respond to price? Are native leaf and cultivated leaf one market or two? Where exactly does the chain sit on the map? And does the processing industry follow the raw material? Every value in this report is computed by a five-script Python pipeline from the public SIDRA API and the open CNPJ registry, and validated by 49 automated checks before it reaches the page.',
 p1c:'Before the four tests, one correction that the pipeline did not catch and a reader did.',
 k2:'THE SERIES', h2s:'The forest kept the lead for most of two decades',
 p2a:'In 1994 Paraná harvested cultivated yerba mate on 2,713 hectares. In 2024 it is 45,065 hectares and 452,222 tonnes, against 323,737 tonnes from native stands. The first version of this study read those two endpoints as a transition and wrote that cultivation overtook the forest in 1998 and never gave the lead back. The year-by-year series says otherwise.',

 p2b:'What changed inside the cultivated stands was not area but yield. Harvested area went from a first peak of 43,038 hectares in 2003 down to 26,086 in 2018, and only reached its record in 2024. Over the same span yield went from about 4 tonnes per hectare to 10. So 2024 is the first year since 2006 with cultivation in front, on a 23.1% jump in cultivated output and a 12.6% drop in the native harvest over a single year. One year is a data point. Whether it marks a durable shift is a question for the 2025 release, not for this one.',

 call1:'A caution on the 1998 jump itself: cultivated output goes from 43,725 tonnes in 1997 to 167,509 in 1998, and the 1999 figure is identical to 1998 to the tonne. That pattern looks more like a survey revision carried forward than a planting wave, so the first crossing should not be over-read either.',
 k3:'TEST 1 · SUPPLY', h3s:'Supply does not respond to price',
 p3a:'The classic model for agricultural supply response is Nerlove’s partial adjustment: this year’s harvested area as a function of last year’s real price and the lagged area itself. Estimated by OLS with Newey-West errors, 1995 to 2024, 30 observations.',

 p3b:'In plain terms: there is no evidence that yerba mate growers plant more when the price rises. The area series above is consistent with that. Harvested area was falling through the 2012 to 2014 price peak and only recovered a decade later.',
 p3c:'Two mechanisms explain this without mystery. The first is biological: yerba mate is a perennial, a seedling takes years to reach its first commercial pruning, so today’s planting decision only becomes supply much later, and installed area keeps producing even at low prices. The second is statistical, and it costs something to admit.',
 call2:'The price in the model is implicit: production value divided by quantity. A harvest shock that raises quantity mechanically lowers that price, pushing the coefficient downward. What this test supports is the absence of a detectable response, not a negative one, and it does not estimate the true elasticity.',
 k4:'TEST 2 · PRICES', h4s:'Two markets that became one around 2012',
 p4a:'If cultivated and native leaf were perfect substitutes, the two prices would move together. On the full sample they do not: Engle-Granger rejects cointegration (p = 0.74) and the log-price correlation is only 0.23. The full series hides the break.',
 capPrices:'<b>Real implicit price, 2024 BRL per kg of green leaf, 1994-2024.</b> Green: cultivated (PAM). Amber: native forest (PEVS). Dashed line: the 2011/2012 break. Values are production value divided by quantity, deflated by the annual mean of the IPCA index.',
 sc1p:'Native leaf sold at an average premium of 122% over cultivated leaf. Log-price correlation 0.46. Two markets.',

 sc3h:'The open question', sc3p:'With 31 annual observations there is no comfortable formal test for the break date, so this stays descriptive. What happened around 2012 that let cultivated leaf catch up with native leaf is the right question for the chain.',
 p4b:'For almost twenty years, leaf from native stands, prized by the traditional industry, was priced on another level. In the last decade the two prices converged. Note that these are state averages of declared value, not the weekly farm-gate quotation surveyed by DERAL, so the levels are not comparable with current market prices; the comparison that holds is between the two series themselves.',

 p6b:'What predicts industry is the leaf of the municipality itself, and the neighbor’s production adds nothing. The mechanism is the processing window: green leaf starts oxidizing after the cut and the flash-drying step, the sapeco, has to happen within hours, so the economic radius between stand and mill is short, and industry settles on top of its raw material. An OLS robustness check on log(1 + mills) confirms the pattern (p = 0.0003).',
 p6c:'Two municipalities read against the grain and explain the caveat. Curitiba has 17 active processing registrations and zero output: head offices and brands, not plants. Mandirituba, in the metropolitan belt, has 13 registrations on 65 tonnes. The registry places the firm where it is registered, not where the leaf is cut, and the fiscal address needs careful reading before it becomes a map.',
 call3:'The model pseudo-R² is 0.63, but the Pearson dispersion is 6.6, so the Poisson standard errors are only trustworthy because they are robust. A negative binomial was tried and degenerated (alpha to zero); the OLS check is the second opinion.',
 k7:'LIMITS, METHOD, REVISION', h7s:'What this study does not support',
 p7a:'Five limits, stated plainly. The 2024 return of cultivation to the lead is one observation and is not evidence of a trend. The PAM and PEVS implicit price is a state average of declared value, not the weekly farm-gate price surveyed by DERAL, so levels are not comparable with current quotations. The Nerlove model with implicit prices inherits endogeneity and the sample is short (30 years), so it rules out a strong response but does not estimate the true elasticity. The CNPJ registry is declaratory: an active registration is not an operating plant. And LISA on log(1 + output), with 266 municipalities at zero, is sensitive to that mass of zeros; the belt is robust, its edges are not.',
 p7b:'Method: production series from SIDRA tables 1613 and 289, deflator from table 1737 (annual mean of the index, 2024 = 1), municipal cut for 2024 on IBGE’s official 2024 mesh at minimal quality. Nerlove by OLS with HAC (Newey-West, 2 lags) errors; ADF and Engle-Granger on log prices; Moran’s I and LISA implemented from scratch in numpy with permutation inference, queen contiguity, no PySAL dependency; Poisson QMLE with HC1 errors in statsmodels. The whole pipeline runs in six Python scripts with cached downloads, and 49 sanity checks lock every published number to the generated statistics.',
 p7c:'Revision, 2026-09-07. The first version of this study, written 2026-08-06, claimed that cultivation overtook the forest in 1998 and kept the lead. The code had recorded the first crossing year and nothing checked whether the lead persisted. The error was caught on the chart by the author before publication. The series section, figure 1 and the test suite were rewritten around the measured year-by-year lead, and a test now fails if the retracted sentence reappears in any text. The econometric results were unchanged by the revision.',
 call4:'On 2026-09-07 the pipeline was re-run against a fresh SIDRA download. PAM and PEVS still end in 2024; every statistic came out identical to the August run. The 2025 release will be the first real test of the 2024 crossing.',

pt:{
 brand:'Erva-mate · Paraná', nav1:'A pergunta', nav2:'A série', nav3:'Oferta', nav4:'Preços',

 kicker:'ECONOMIA AGRÍCOLA · 30 ANOS DE IBGE · 399 MUNICÍPIOS',
 h1:'Erva-mate no Paraná',
 sub:'Quatro testes econométricos, e uma leitura que tive de retirar',
 thesis:'O Paraná colheu 775.959 toneladas de erva-mate em 2024, mais que o dobro do segundo estado, e 85,8% de tudo que o Brasil ainda colhe em floresta nativa. Lida pelas duas pontas, a série parece uma transição limpa da floresta para a lavoura. Lida ano a ano, diz o contrário: a floresta liderou em 18 dos 20 anos até 2023, e 2024 é a primeira liderança do cultivo desde 2006.',
 src:'Dados: IBGE PAM (tabela 1613, 1974-2024) · IBGE PEVS (tabela 289, 1986-2024) · IPCA (tabela 1737) · malha municipal IBGE 2024 · Dados Abertos do CNPJ da Receita Federal, carga 2026-07. 49 checagens automáticas. Análise: Avner Gomes.',
 hs1v:'775.959 t', hs1:'colhidas no Paraná em 2024, cultivo mais erval nativo',
 v_share:'85,8%', v_ne1:'−0,11', v_ne2:'−0,02', v_ne3:'0,21', v_moran:'0,806', v_cr5:'60,1%', v_gini:'0,966', v_irr1:'1,37', v_irr2:'1,03',
 hs2:'da erva-mate de floresta nativa do Brasil sai do Paraná',
 hs3:'anos entre 2004 e 2023 com o erval nativo à frente do cultivo',
 hs4:'municípios formam o único cinturão Alto-Alto (LISA)',
 k1:'A PERGUNTA', h1s:'O que um número de 775.959 toneladas diz de fato?',
 p1a:'A erva-mate é uma das poucas culturas do Brasil que ainda é colhida de dois jeitos ao mesmo tempo: podada de ervais plantados, o que a Produção Agrícola Municipal do IBGE (PAM) registra, e colhida de árvores em pé na floresta com araucária, o que a Produção da Extração Vegetal e da Silvicultura (PEVS) registra em separado. Somando as duas, o Paraná chega a 775.959 toneladas em 2024, contra 302.212 do Rio Grande do Sul e 139.764 de Santa Catarina.',
 p1b:'Este estudo faz quatro perguntas a esse número. A oferta responde ao preço? Folha nativa e folha cultivada são um mercado ou dois? Onde exatamente a cadeia está no mapa? E a indústria de processamento segue a matéria-prima? Cada valor deste relatório é calculado por um pipeline Python de cinco scripts a partir da API pública do SIDRA e do cadastro CNPJ aberto, e validado por 49 checagens automáticas antes de chegar à página.',
 p1c:'Antes dos quatro testes, uma correção que o pipeline não pegou e um leitor pegou.',
 k2:'A SÉRIE', h2s:'A floresta manteve a liderança na maior parte de duas décadas',
 p2a:'Em 1994 o Paraná colhia erva-mate cultivada em 2.713 hectares. Em 2024 são 45.065 hectares e 452.222 toneladas, contra 323.737 toneladas vindas de ervais nativos. A primeira versão deste estudo leu essas duas pontas como uma transição e escreveu que o cultivo ultrapassou a floresta em 1998 e manteve a liderança desde então. A série ano a ano diz outra coisa.',
 rvPlace:'A MESMA SÉRIE, LIDA ANO A ANO',
 rvRoad:'Erval nativo à frente em 18 dos 20 anos de 2004 a 2023',
 rvSub:'A produção cultivada passou a colheita nativa pela primeira vez em 1998, segurou a liderança até 2003 e depois ficou atrás. As únicas exceções nas duas décadas seguintes foram 2005 e 2006.',
 st1l:'anos com a floresta à frente, 2004-2023', st1n:'O cultivo liderou só em 2005 e 2006. A produção nativa teve pico de 442.189 toneladas em 2021.',
 st2v:'43.038 → 26.086', st2l:'hectares cultivados, 2003 a 2018', st2n:'A área caiu por quinze anos antes do recorde de 45.065 ha em 2024. O rendimento foi de 4.044 kg/ha em 2010 para 10.035 em 2024.',
 st3l:'primeira liderança do cultivo desde 2006', st3n:'Com salto de 23,1% na produção cultivada e queda de 12,6% na colheita nativa, em um único ano.',
 capSeries:'<b>Produção de erva-mate no Paraná, mil toneladas, 1986-2024.</b> Verde: cultivo (PAM). Âmbar: floresta nativa (PEVS). Faixa sombreada: 2004-2023, quando a floresta ficou à frente em 18 dos 20 anos. Fonte: IBGE SIDRA, tabelas 1613 e 289.',
 p2b:'O que mudou dentro dos ervais plantados não foi a área, foi o rendimento. A área colhida foi de um primeiro pico de 43.038 hectares em 2003 para 26.086 em 2018, e só chegou ao recorde em 2024. No mesmo intervalo o rendimento foi de cerca de 4 toneladas por hectare para 10. Então 2024 é o primeiro ano desde 2006 com o cultivo na frente, com salto de 23,1% na produção cultivada e queda de 12,6% na colheita nativa em um único ano. Um ano é um ponto. Se ele marca uma virada durável é pergunta para a divulgação de 2025, não para esta.',
 capArea:'<b>Área cultivada (mil ha) e rendimento (kg/ha), 1994-2024.</b> A área caiu de 2003 a 2018 enquanto o rendimento mais que dobrou depois de 2011. Fonte: IBGE PAM, área colhida e rendimento médio.',
 call1:'Uma cautela sobre o próprio salto de 1998: a produção cultivada vai de 43.725 toneladas em 1997 para 167.509 em 1998, e o valor de 1999 é idêntico ao de 1998 até a tonelada. Esse padrão parece mais uma revisão de levantamento carregada adiante do que uma onda de plantio, então o primeiro cruzamento também não deve ser lido além do que vale.',
 k3:'TESTE 1 · OFERTA', h3s:'A oferta não responde ao preço',
 p3a:'O modelo clássico para resposta de oferta agrícola é o de Nerlove, de ajustamento parcial: a área colhida deste ano em função do preço real do ano anterior e da própria área defasada. Estimado por MQO com erros de Newey-West, 1995 a 2024, 30 observações.',
 ne1l:'elasticidade-preço de curto prazo, cultivo', ne1n:'Erro-padrão 0,087, p = 0,20. Não é diferente de zero.',
 ne2l:'elasticidade-preço de curto prazo, extrativismo', ne2n:'Quantidade no lugar de área. p = 0,69.',
 ne3l:'coeficiente de ajustamento', ne3n:'A área fecha cerca de um quinto da distância ao nível de longo prazo por ano.',
 p3b:'Em português: não há evidência de que produtor de erva-mate plante mais quando o preço sobe. A série de área acima é coerente com isso. A área colhida estava caindo durante o pico de preço de 2012 a 2014 e só se recuperou uma década depois.',
 p3c:'Dois mecanismos explicam isso sem mistério. O primeiro é biológico: a erva-mate é perene, a muda leva anos até a primeira poda comercial, então a decisão de plantio de hoje só vira oferta lá na frente, e a área instalada continua produzindo mesmo com preço baixo. O segundo é estatístico, e custa admitir.',
 call2:'O preço do modelo é implícito: valor da produção dividido por quantidade. Um choque de safra que aumenta a quantidade derruba esse preço mecanicamente, empurrando o coeficiente para baixo. O que este teste sustenta é a ausência de resposta detectável, não uma resposta negativa, e ele não estima a elasticidade verdadeira.',
 k4:'TESTE 2 · PREÇOS', h4s:'Dois mercados que viraram um por volta de 2012',
 p4a:'Se folha cultivada e folha nativa fossem substitutas perfeitas, os dois preços andariam juntos. Na amostra completa não andam: Engle-Granger rejeita cointegração (p = 0,74) e a correlação dos logs é de apenas 0,23. A série inteira esconde a quebra.',
 capPrices:'<b>Preço implícito real, R$ de 2024 por kg de folha verde, 1994-2024.</b> Verde: cultivo (PAM). Âmbar: floresta nativa (PEVS). Tracejado: a quebra de 2011/2012. Valores são valor da produção dividido por quantidade, deflacionados pela média anual do IPCA.',
 sc1p:'A folha nativa foi vendida com prêmio médio de 122% sobre a cultivada. Correlação dos log-preços de 0,46. Dois mercados.',
 sc2p:'O prêmio cai para 10% e a correlação sobe para 0,82. As duas séries passam a andar praticamente juntas.',
 sc3h:'A pergunta em aberto', sc3p:'Com 31 observações anuais não há teste formal confortável para a data da quebra, então isto fica descritivo. O que aconteceu por volta de 2012 que fez a folha cultivada alcançar a nativa é a pergunta certa para a cadeia.',
 p4b:'Durante quase vinte anos a folha de erval nativo, mais valorizada pela indústria tradicional, foi precificada em outro patamar. Na última década os dois preços convergiram. Note que estas são médias estaduais de valor declarado, não a cotação semanal de porteira que o DERAL levanta, então os níveis não são comparáveis com o preço corrente de mercado; a comparação que vale é entre as duas séries.',
 k5:'TESTE 3 · O CINTURÃO', h5s:'Um único cinturão, e ele é a região da araucária',
 p5a:'A produção municipal de 2024 tem autocorrelação espacial altíssima: I de Moran de 0,806 sobre o log da produção, contra −0,0025 esperado sob aleatoriedade, pseudo p de 0,001 em 999 permutações. A erva-mate não está espalhada pelo estado. Está num único cinturão contíguo.',
 mapAlt:'Mapa de clusters LISA da produção de erva-mate de 2024 nos 399 municípios do Paraná: um único cinturão Alto-Alto no centro-sul',
 lgHH:'Alto-Alto (82)', lgLH:'Baixo-Alto (3)', lgLL:'Baixo-Baixo (1)', lgNS:'não significativo (313)',
 capMap:'<b>Clusters LISA da produção 2024 (log), contiguidade queen, 999 permutações condicionais, significância de 5%.</b> O cinturão Alto-Alto vai de Cruz Machado e São Mateus do Sul a Guarapuava, Bituruna e o entorno de Irati. Malha: IBGE 2024, qualidade mínima.',
 mp1l:'I de Moran, log da produção', mp1n:'Esperado −0,0025 sob aleatoriedade. Pseudo p = 0,001, 999 permutações.',
 mp2l:'municípios Alto-Alto de 399', mp2n:'Mais 3 Baixo-Alto e 1 Baixo-Baixo. 313 não significativos, a maioria com produção zero.',
 mp3l:'da produção estadual nos 5 maiores municípios', mp3n:'Os 10 maiores somam 80,1%. 133 dos 399 municípios declaram alguma produção.',
 mp4l:'Gini municipal da produção', mp4n:'Concentração extrema mesmo dentro do cinturão.',
 p5b:'O cinturão é a área de ocorrência natural da Araucaria angustifolia, o que faz sentido botânico: a erva-mate é espécie do sub-bosque da floresta com araucária. A produção segue o bioma, não a divisão administrativa. Cruz Machado sozinha colheu 148 mil toneladas em 2024, mais do que o estado inteiro de Santa Catarina.',
 thMun:'Município', thT:'Produção 2024 (t)', thShare:'Parte do estado', thMills:'Ervateiras ativas',
 pull1:'O mapa da erva-mate é o mapa da floresta com araucária. Desenhe um e terá desenhado o outro.',
 k6:'TESTE 4 · AS ERVATEIRAS', h6s:'A indústria segue a folha, e segue de perto',
 p6a:'O lado industrial vem de outra fonte: os Dados Abertos do CNPJ da Receita Federal, carga 2026-07, filtrados aos estabelecimentos com atividade principal de processamento de erva-mate (CNAE 1099605 ou 1122402) e situação cadastral ativa. São 228 ervateiras, todas geocodificadas, cruzadas aqui com a produção municipal.',
 capScatter:'<b>Ervateiras ativas por município contra a produção de 2024 (toneladas, escala log), 399 municípios.</b> Verde: municípios do cinturão Alto-Alto. Cinza: os demais. Pontos na borda esquerda declaram produção zero. Poisson QMLE com erros robustos: razão de incidência 1,37 por unidade de log da produção (p = 0,003).',
 in1l:'razão de incidência, produção do próprio município', in1n:'Poisson QMLE, erros HC1, p = 0,003. Cada unidade de log da produção eleva o número esperado de ervateiras em 37%.',
 in2l:'razão de incidência, produção dos vizinhos', in2n:'Defasagem espacial do log da produção. p = 0,78. Não acrescenta nada.',
 in3l:'ervateiras ativas no cadastro', in3n:'CNAE principal 1099605 ou 1122402, situação ativa. 1.539 estabelecimentos têm o código em qualquer posição.',
 in4l:'Curitiba: cadastros vs produção', in4n:'17 CNPJs ativos de processamento e produção agrícola zero.',
 p6b:'O que prevê a presença de indústria é a folha do próprio município, e a produção do vizinho não acrescenta nada. O mecanismo é a janela de processamento: a folha verde começa a oxidar depois do corte e o sapeco precisa acontecer em horas, então o raio econômico entre erval e engenho é curto, e a indústria se instala em cima da matéria-prima. Uma robustez em MQO sobre log(1 + ervateiras) confirma o padrão (p = 0,0003).',
 p6c:'Dois municípios vão contra a corrente e explicam o cuidado com a leitura. Curitiba tem 17 CNPJs ativos de processamento e produção zero: sedes e marcas, não plantas. Mandirituba, na região metropolitana, tem 13 cadastros sobre 65 toneladas. O cadastro coloca a empresa onde ela está registrada, não onde a folha é cortada, e o endereço fiscal precisa ser lido com cuidado antes de virar mapa.',
 call3:'O pseudo-R² do modelo é 0,63, mas a dispersão de Pearson é 6,6, então os erros-padrão do Poisson só são confiáveis porque são robustos. Uma binomial negativa foi tentada e degenerou (alfa para zero); a checagem em MQO é a segunda opinião.',
 k7:'LIMITES, MÉTODO, REVISÃO', h7s:'O que este estudo não sustenta',
 p7a:'Cinco limites, ditos sem rodeio. A volta do cultivo à liderança em 2024 é uma observação e não é evidência de tendência. O preço implícito da PAM e da PEVS é uma média estadual de valor declarado, não o preço de porteira que o DERAL levanta semanalmente, então os níveis não são comparáveis com as cotações correntes. O modelo de Nerlove com preço implícito herda endogeneidade e a amostra é curta (30 anos), então ele descarta resposta forte, mas não estima a elasticidade verdadeira. O cadastro CNPJ é declaratório: CNPJ ativo não é planta operando. E o LISA sobre log(1 + produção), com 266 municípios em zero, é sensível a essa massa de zeros; o cinturão é robusto, as bordas dele não.',
 p7b:'Método: séries de produção das tabelas 1613 e 289 do SIDRA, deflator da tabela 1737 (média anual do índice, 2024 = 1), corte municipal de 2024 sobre a malha oficial 2024 do IBGE em qualidade mínima. Nerlove por MQO com erros HAC (Newey-West, 2 defasagens); ADF e Engle-Granger nos log-preços; I de Moran e LISA implementados do zero em numpy com inferência por permutação, contiguidade queen, sem dependência de PySAL; Poisson QMLE com erros HC1 no statsmodels. O pipeline inteiro roda em seis scripts Python com downloads em cache, e 49 checagens de sanidade travam cada número publicado às estatísticas geradas.',
 p7c:'Revisão, 2026-09-07. A primeira versão deste estudo, escrita em 2026-08-06, afirmava que o cultivo ultrapassou a floresta em 1998 e manteve a liderança. O código registrava o primeiro ano de cruzamento e nada conferia se a liderança persistia. O erro foi pego no gráfico pelo autor antes da publicação. A seção da série, a figura 1 e a suíte de testes foram reescritas em torno da liderança medida ano a ano, e um teste agora falha se a frase retirada reaparecer em qualquer texto. Os resultados econométricos não mudaram com a revisão.',
 call4:'Em 2026-09-07 o pipeline foi rodado de novo sobre um download novo do SIDRA. PAM e PEVS ainda terminam em 2024; cada estatística saiu idêntica à rodada de agosto. A divulgação de 2025 será o primeiro teste real do cruzamento de 2024.',

 ft2:'Fontes: IBGE PAM (SIDRA 1613), PEVS (SIDRA 289), IPCA (SIDRA 1737), malha municipal IBGE 2024; Receita Federal, Dados Abertos do CNPJ, carga 2026-07. Só agregados municipais; nenhum dado pessoal entra nesta página.',

 h1:'Yerba mate en Paraná',

 thesis:'Paraná cosechó 775.959 toneladas de yerba mate en 2024, más del doble que el segundo estado, y el 85,8% de todo lo que Brasil todavía recoge en bosque nativo. Leída por los extremos, la serie parece una transición limpia del bosque al cultivo. Leída año a año, dice lo contrario: el bosque lideró en 18 de los 20 años hasta 2023, y 2024 es el primer liderazgo del cultivo desde 2006.',
 src:'Datos: IBGE PAM (tabla 1613, 1974-2024) · IBGE PEVS (tabla 289, 1986-2024) · IPCA (tabla 1737) · malla municipal IBGE 2024 · registro abierto CNPJ de la Receita Federal, carga 2026-07. 49 verificaciones automáticas. Análisis: Avner Gomes.',

 v_share:'85,8%', v_ne1:'−0,11', v_ne2:'−0,02', v_ne3:'0,21', v_moran:'0,806', v_cr5:'60,1%', v_gini:'0,966', v_irr1:'1,37', v_irr2:'1,03',

 k1:'LA PREGUNTA', h1s:'¿Qué dice realmente una cifra de 775.959 toneladas?',
 p1a:'La yerba mate es uno de los pocos cultivos de Brasil que todavía se cosecha de dos maneras a la vez: podada de plantaciones, lo que registra la Producción Agrícola Municipal del IBGE (PAM), y recogida de árboles en pie en el bosque de araucaria, lo que la Producción de la Extracción Vegetal y de la Silvicultura (PEVS) registra por separado. Sumando las dos, Paraná llega a 775.959 toneladas en 2024, contra 302.212 de Rio Grande do Sul y 139.764 de Santa Catarina.',
 p1b:'Este estudio le hace cuatro preguntas a esa cifra. ¿La oferta responde al precio? ¿La hoja nativa y la hoja cultivada son un mercado o dos? ¿Dónde exactamente está la cadena en el mapa? ¿Y la industria de procesamiento sigue a la materia prima? Cada valor de este informe lo calcula un pipeline Python de cinco scripts a partir de la API pública de SIDRA y del registro abierto CNPJ, y lo validan 49 verificaciones automáticas antes de llegar a la página.',
 p1c:'Antes de las cuatro pruebas, una corrección que el pipeline no detectó y un lector sí.',
 k2:'LA SERIE', h2s:'El bosque mantuvo el liderazgo la mayor parte de dos décadas',
 p2a:'En 1994 Paraná cosechaba yerba mate cultivada en 2.713 hectáreas. En 2024 son 45.065 hectáreas y 452.222 toneladas, contra 323.737 toneladas de bosque nativo. La primera versión de este estudio leyó esos dos extremos como una transición y escribió que el cultivo superó al bosque en 1998 y mantuvo el liderazgo desde entonces. La serie año a año dice otra cosa.',
 rvPlace:'LA MISMA SERIE, LEÍDA AÑO A AÑO',
 rvRoad:'Bosque nativo por delante en 18 de los 20 años de 2004 a 2023',

 st1l:'años con el bosque por delante, 2004-2023', st1n:'El cultivo lideró solo en 2005 y 2006. La producción nativa alcanzó su pico de 442.189 toneladas en 2021.',
 st2v:'43.038 → 26.086', st2l:'hectáreas cultivadas, 2003 a 2018', st2n:'El área cayó durante quince años antes del récord de 45.065 ha en 2024. El rendimiento pasó de 4.044 kg/ha en 2010 a 10.035 en 2024.',
 st3l:'primer liderazgo del cultivo desde 2006', st3n:'Con un salto del 23,1% en la producción cultivada y una caída del 12,6% en la cosecha nativa, en un solo año.',
 capSeries:'<b>Producción de yerba mate en Paraná, miles de toneladas, 1986-2024.</b> Verde: cultivo (PAM). Ámbar: bosque nativo (PEVS). Franja sombreada: 2004-2023, cuando el bosque estuvo por delante en 18 de 20 años. Fuente: IBGE SIDRA, tablas 1613 y 289.',
 p2b:'Lo que cambió dentro de las plantaciones no fue el área sino el rendimiento. El área cosechada pasó de un primer pico de 43.038 hectáreas en 2003 a 26.086 en 2018, y solo alcanzó su récord en 2024. En el mismo lapso el rendimiento pasó de unas 4 toneladas por hectárea a 10. Así que 2024 es el primer año desde 2006 con el cultivo por delante, con un salto del 23,1% en la producción cultivada y una caída del 12,6% en la cosecha nativa en un solo año. Un año es un punto. Si marca un giro duradero es una pregunta para la divulgación de 2025, no para esta.',
 capArea:'<b>Área cultivada (miles de ha) y rendimiento (kg/ha), 1994-2024.</b> El área cayó de 2003 a 2018 mientras el rendimiento más que se duplicó después de 2011. Fuente: IBGE PAM, área cosechada y rendimiento medio.',
 call1:'Una cautela sobre el propio salto de 1998: la producción cultivada pasa de 43.725 toneladas en 1997 a 167.509 en 1998, y la cifra de 1999 es idéntica a la de 1998 hasta la tonelada. Ese patrón se parece más a una revisión de encuesta arrastrada hacia adelante que a una ola de plantación, así que el primer cruce tampoco debe leerse más allá de lo que vale.',

 ne1l:'elasticidad-precio de corto plazo, cultivo', ne1n:'Error estándar 0,087, p = 0,20. No es distinta de cero.',
 ne2l:'elasticidad-precio de corto plazo, cosecha nativa', ne2n:'Cantidad en lugar de área. p = 0,69.',

const HTML_KEYS = new Set(['capSeries','capArea','capPrices','capMap','capScatter','ft1','ft2','ft3']);
let lang = 'en';
const LOC = {en:'en-US',pt:'pt-BR',es:'es-ES'};
const fmt = (v,d) => Number(v).toLocaleString(LOC[lang], {minimumFractionDigits:d||0, maximumFractionDigits:d||0});

/* ======================= gráficos (SVG puro) ======================= */
const NS = 'http://www.w3.org/2000/svg';
const C_PAM = 'oklch(76% 0.16 150)', C_PEVS = 'oklch(78% 0.12 75)', C_GRID = 'oklch(24% 0.022 160)', C_MUT = 'oklch(62% 0.02 160)', C_INK2 = 'oklch(83% 0.014 160)';
function sv(tag, attrs, parent){ const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function chartFrame(w, h){ return sv('svg', {viewBox:`0 0 ${w} ${h}`, role:'img'}); }
function axisText(svgEl, x, y, txt, anchor, fill, size, weight){
  const t = sv('text', {x, y, 'text-anchor':anchor||'start', fill:fill||C_MUT,
    'font-family':'JetBrains Mono,monospace', 'font-size':size||11, 'font-weight':weight||400}, svgEl); t.textContent = txt; return t; }
const LBL = {
  en:{pam:'cultivated (PAM)', pevs:'native forest (PEVS)', band:'forest ahead, 18 of 20 years', first:'2024: first cultivated | lead since 2006', area:'harvested area (thousand ha)', yld:'yield (kg/ha)', brk:'2011 | 2012', pre:'premium 122%', post:'premium 10%', zero:'zero output', mills:'active mills', out:'output 2024 (t, log)'},
  pt:{pam:'cultivo (PAM)', pevs:'floresta nativa (PEVS)', band:'floresta à frente, 18 de 20 anos', first:'2024: primeira liderança | do cultivo desde 2006', area:'área colhida (mil ha)', yld:'rendimento (kg/ha)', brk:'2011 | 2012', pre:'prêmio 122%', post:'prêmio 10%', zero:'produção zero', mills:'ervateiras ativas', out:'produção 2024 (t, log)'},
  es:{pam:'cultivo (PAM)', pevs:'bosque nativo (PEVS)', band:'bosque por delante, 18 de 20 años', first:'2024: primer liderazgo | del cultivo desde 2006', area:'área cosechada (miles de ha)', yld:'rendimiento (kg/ha)', brk:'2011 | 2012', pre:'prima 122%', post:'prima 10%', zero:'producción cero', mills:'molinos activos', out:'producción 2024 (t, log)'},
};

function drawSeries(){
  const L_=LBL[lang]; const W=960,H=360,L=52,R=170,T=18,B=34,w=W-L-R,h=H-T-B,ymax=460;
  const el=document.getElementById('figSeries'); el.innerHTML='';
  const s=chartFrame(W,H); el.appendChild(s);
  const yrs=D.years_q, n=yrs.length;
  const X=i=>L+w*i/(n-1), Y=v=>T+h*(1-v/ymax);
  const i04=yrs.indexOf(2004), i23=yrs.indexOf(2023);
  sv('rect',{x:X(i04)-w/(n-1)/2,y:T,width:X(i23)-X(i04)+w/(n-1),height:h,fill:'oklch(100% 0 0 / 0.045)'},s);
  for (const g of [0,100,200,300,400]){ sv('line',{x1:L,x2:W-R,y1:Y(g),y2:Y(g),stroke:C_GRID,'stroke-width':1},s);
    axisText(s,L-8,Y(g)+4,String(g),'end'); }
  for (const yr of [1990,2000,2010,2020]) axisText(s,X(yrs.indexOf(yr)),H-10,String(yr),'middle');
  const path=(arr)=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v/1000).toFixed(1)).join(' ');
  sv('path',{d:path(D.pevs_t),fill:'none',stroke:C_PEVS,'stroke-width':2.4,'stroke-linejoin':'round'},s);
  sv('path',{d:path(D.pam_t),fill:'none',stroke:C_PAM,'stroke-width':2.6,'stroke-linejoin':'round'},s);
  axisText(s,X(n-1)+8,Y(D.pam_t[n-1]/1000)+4,L_.pam,'start',C_PAM,12.5,600);
  axisText(s,X(n-1)+8,Y(D.pevs_t[n-1]/1000)+4,L_.pevs,'start',C_PEVS,12.5,600);
  L_.first.split('|').forEach((ln,k)=>axisText(s,X(n-1)+8,Y(D.pam_t[n-1]/1000)+20+k*13,ln.trim(),'start',C_MUT,10.5));
  axisText(s,(X(i04)+X(i23))/2,Y(20),L_.band,'middle',C_INK2,11.5);
  axisText(s,X(yrs.indexOf(2021)),Y(D.pevs_t[yrs.indexOf(2021)]/1000)-9,'442 (2021)','middle',C_PEVS,11);
  axisText(s,X(yrs.indexOf(2001)),Y(D.pam_t[yrs.indexOf(2001)]/1000)-9,'339 (2001)','middle',C_PAM,11);
}

function drawArea(){
  const L_=LBL[lang]; const W=960,H=300,T=30,B=34,gap=70;
  const el=document.getElementById('figArea'); el.innerHTML='';
  const s=chartFrame(W,H); el.appendChild(s);
  const i94=D.years_q.indexOf(1994); const yrs=D.years_q.slice(i94), n=yrs.length;
  const area=D.area_ha.slice(i94).map(v=>v/1000), yld=D.yield_kg_ha.slice(i94);
  const pw=(W-gap)/2-40;
  function panel(x0,vals,ymax,ticks,color,label){
    const L=x0+40,w=pw,h=H-T-B; const X=i=>L+w*i/(n-1), Y=v=>T+h*(1-v/ymax);
    for (const g of ticks){ sv('line',{x1:L,x2:L+w,y1:Y(g),y2:Y(g),stroke:C_GRID,'stroke-width':1},s); axisText(s,L-8,Y(g)+4,fmt(g),'end'); }
    for (const yr of [1995,2005,2015,2024]) axisText(s,X(yrs.indexOf(yr)),H-10,String(yr),yr===2024?'end':'middle');
    const path=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
    sv('path',{d:path,fill:'none',stroke:color,'stroke-width':2.4,'stroke-linejoin':'round'},s);
    vals.forEach((v,i)=>sv('circle',{cx:X(i),cy:Y(v),r:2.4,fill:color},s));
    axisText(s,L,T-12,label,'start',C_INK2,12.5,600);
    return {X,Y};
  }
  const a=panel(0,area,50,[0,10,20,30,40,50],C_PAM,L_.area);
  axisText(s,a.X(yrs.indexOf(2003)),a.Y(area[yrs.indexOf(2003)])-9,'43,0 (2003)'.replace(',',lang==='en'?'.':','),'middle',C_MUT,10.5);
  axisText(s,a.X(yrs.indexOf(2018)),a.Y(area[yrs.indexOf(2018)])+16,'26,1 (2018)'.replace(',',lang==='en'?'.':','),'middle',C_MUT,10.5);
  const b=panel(pw+gap+40,yld,11000,[0,2500,5000,7500,10000],C_PAM,L_.yld);
  axisText(s,b.X(n-1)-6,b.Y(yld[n-1])-9,fmt(10035)+' (2024)','end',C_MUT,10.5);
  axisText(s,b.X(yrs.indexOf(2010)),b.Y(yld[yrs.indexOf(2010)])+16,fmt(4044)+' (2010)','middle',C_MUT,10.5);
}

function drawPrices(){
  const L_=LBL[lang]; const W=960,H=340,L=52,R=170,T=18,B=34,w=W-L-R,h=H-T-B,ymax=4.6;
  const el=document.getElementById('figPrices'); el.innerHTML='';
  const s=chartFrame(W,H); el.appendChild(s);
  const yrs=D.years_p, n=yrs.length;
  const X=i=>L+w*i/(n-1), Y=v=>T+h*(1-v/ymax);
  for (const g of [0,1,2,3,4]){ sv('line',{x1:L,x2:W-R,y1:Y(g),y2:Y(g),stroke:C_GRID,'stroke-width':1},s);
    axisText(s,L-8,Y(g)+4,fmt(g,2),'end'); }
  for (const yr of [1995,2000,2005,2010,2015,2020,2024]) axisText(s,X(yrs.indexOf(yr)),H-10,String(yr),'middle');
  const xb=(X(yrs.indexOf(2011))+X(yrs.indexOf(2012)))/2;
  sv('line',{x1:xb,x2:xb,y1:T,y2:H-B,stroke:C_MUT,'stroke-width':1,'stroke-dasharray':'4 5'},s);
  axisText(s,xb-8,T+12,L_.pre,'end',C_INK2,11.5);
  axisText(s,xb+8,T+12,L_.post,'start',C_INK2,11.5);
  const path=(arr)=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  sv('path',{d:path(D.pevs_price),fill:'none',stroke:C_PEVS,'stroke-width':2.4,'stroke-linejoin':'round'},s);
  sv('path',{d:path(D.pam_price),fill:'none',stroke:C_PAM,'stroke-width':2.6,'stroke-linejoin':'round'},s);
  axisText(s,X(n-1)+8,Y(D.pevs_price[n-1])-4,L_.pevs,'start',C_PEVS,12.5,600);
  axisText(s,X(n-1)+8,Y(D.pam_price[n-1])+12,L_.pam,'start',C_PAM,12.5,600);
  axisText(s,X(0)+8,Y(D.pevs_price[0])+4,fmt(4.44,2),'start',C_PEVS,11);
  const i14=yrs.indexOf(2014);
  axisText(s,X(i14),Y(D.pevs_price[i14])-10,fmt(2.22,2)+' (2014)','middle',C_MUT,11);
}

function drawScatter(){
  const L_=LBL[lang]; const W=960,H=400,L=52,R=20,T=18,B=44,w=W-L-R,h=H-T-B,ymax=18;
  const el=document.getElementById('figScatter'); el.innerHTML='';
  const s=chartFrame(W,H); el.appendChild(s);
  const zeroW=60; const lx0=L+zeroW; const lw=w-zeroW; const lmin=0, lmax=5.3; /* log10 t: 1 .. 200k */
  const X=t=>t<=0? L+zeroW*0.45 : lx0+lw*(Math.log10(t)-lmin)/(lmax-lmin);
  const Y=v=>T+h*(1-v/ymax);
  for (const g of [0,4,8,12,16]){ sv('line',{x1:L,x2:W-R,y1:Y(g),y2:Y(g),stroke:C_GRID,'stroke-width':1},s); axisText(s,L-8,Y(g)+4,String(g),'end'); }
  sv('line',{x1:lx0-4,x2:lx0-4,y1:T,y2:H-B,stroke:C_GRID,'stroke-width':1,'stroke-dasharray':'3 4'},s);
  axisText(s,L+zeroW*0.45,H-22,L_.zero,'middle',C_MUT,10.5);
  for (const e of [1,2,3,4,5]){ axisText(s,X(Math.pow(10,e)),H-22,fmt(Math.pow(10,e)),'middle'); }
  axisText(s,lx0+lw/2,H-6,L_.out,'middle',C_MUT,11);
  axisText(s,L,T-6,L_.mills,'start',C_INK2,12,600);
  const rows=D.scatter.slice().sort((a,b)=>(a.c==='HH')-(b.c==='HH'));
  rows.forEach((r,i)=>{ const jitter=r.t<=0?((i%7)-3)*3.2:0;
    sv('circle',{cx:X(r.t)+jitter,cy:Y(r.m),r:4.2,fill:r.c==='HH'?C_PAM:C_MUT,opacity:r.c==='HH'?0.85:0.55,stroke:'oklch(14% 0.02 160)','stroke-width':0.6},s); });
  const tag=(name,dx,dy,anchor)=>{ const r=D.scatter.find(q=>q.n===name); if(!r) return;
    axisText(s,X(r.t)+dx,Y(r.m)+dy,name,anchor||'start',C_INK2,11); };
  tag('Curitiba',10,4); tag('Mandirituba',10,4); tag('Guarapuava',-10,-6,'end'); tag('Bituruna',-10,-6,'end');
  tag('Cruz Machado',-10,-6,'end'); tag('São Mateus do Sul',-10,14,'end');
}

/* ======================= i18n render ======================= */
function setLang(l){
  if(!I18N[l]) l='en';
  lang=l;
  document.documentElement.lang = l==='pt'?'pt-BR':l;
  const T=I18N[l];
  document.querySelectorAll('[data-i]').forEach(el=>{
    const k=el.getAttribute('data-i'); if(!(k in T)) return;
    if (HTML_KEYS.has(k)) el.innerHTML=T[k]; else el.textContent=T[k];
  });
  document.querySelectorAll('[data-i-alt]').forEach(el=>{ el.alt=T[el.getAttribute('data-i-alt')]||''; });
  document.querySelectorAll('nav .langs button').forEach(b=>b.classList.toggle('on',b.dataset.setlang===l));
  const tb=document.getElementById('tblTop'); tb.innerHTML='';
  const tot=D.scatter.reduce((a,r)=>a+r.t,0);
  for (const r of D.stats.concentracao.top5){
    const row=D.scatter.find(q=>q.n===r.municipio);
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+r.municipio+'</td><td class="num">'+fmt(r.qtd_total_t)+'</td><td class="num">'+fmt(100*r.qtd_total_t/tot,1)+'%</td><td class="num">'+(row?row.m:'')+'</td>';
    tb.appendChild(tr);
  }
  drawSeries(); drawArea(); drawPrices(); drawScatter();
  if (location.hash!=='#'+l) history.replaceState(null,'','#'+l);
}
document.querySelectorAll('nav .langs button').forEach(b=>b.onclick=()=>setLang(b.dataset.setlang));
window.addEventListener('hashchange',()=>setLang((location.hash||'').replace('#','').toLowerCase()));
window.addEventListener('scroll',()=>{
  const d=document.documentElement;
  document.getElementById('prog').style.width=(100*d.scrollTop/(d.scrollHeight-d.clientHeight))+'%';
});
